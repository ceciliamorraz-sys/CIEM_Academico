<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Chat CIEM ONE
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<h5>

💬 Conversación

</h5>


</div>



<div class="card-body"
style="height:450px;overflow-y:auto;">



{% for m in mensajes %}



{% if m.emisor == "docente" %}


<div class="text-end mb-3">


<div class="d-inline-block bg-primary text-white rounded p-3">


{{m.mensaje}}


<br>


<small>

{{m.fecha.strftime("%H:%M")}}

</small>


</div>


</div>



{% else %}


<div class="text-start mb-3">


<div class="d-inline-block bg-light border rounded p-3">


{{m.mensaje}}


<br>


<small>

{{m.fecha.strftime("%H:%M")}}

</small>


</div>


</div>



{% endif %}



{% endfor %}



</div>



<div class="card-footer">


<form method="POST" action="{{ url_for('docente.responder_mensaje', id=conversacion._id) }}">

<input type="hidden"
       name="conversacion_id"
       value="{{ conversacion._id }}">

<textarea name="respuesta" class="form-control"></textarea>

<button>
Enviar
</button>

</form>

</div>


</div>


</body>

</html>
