<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial de Matrícula | CIEM Académico</title>
    <style>
        :root { color-scheme: light; --azul:#0d2a52; --azul2:#1e4e8c; --oro:#ffc107; --fondo:#f3f6fa; --texto:#1d3256; --muted:#687586; }
        * { box-sizing:border-box; }
        body { margin:0; padding:24px 14px 48px; background:var(--fondo); color:var(--texto); font-family:"Segoe UI",Arial,sans-serif; }
        .contenedor { width:min(100%,980px); margin:0 auto; }
        .encabezado { padding:26px 30px; color:#fff; background:linear-gradient(135deg,#08142c,var(--azul)); border-radius:14px 14px 0 0; box-shadow:0 5px 18px #0002; }
        .encabezado h1 { margin:0; font-size:clamp(22px,4vw,30px); }
        .encabezado p { margin:8px 0 0; opacity:.86; }
        .contenido { padding:26px 30px 32px; background:#fff; border-radius:0 0 14px 14px; box-shadow:0 5px 18px #00000012; }
        .btn-volver { display:inline-block; margin-bottom:22px; color:var(--azul2); font-weight:650; text-decoration:none; }
        .btn-volver:hover { text-decoration:underline; }
        .busqueda { padding:20px; border:1px solid #e1e7ee; border-radius:12px; background:#fbfcfe; }
        .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
        .campo { display:flex; flex-direction:column; gap:7px; }
        .campo label { font-size:14px; font-weight:650; }
        input,select,button { font:inherit; }
        input,select { width:100%; min-height:44px; padding:10px 12px; color:var(--texto); background:#fff; border:1px solid #cbd5e1; border-radius:8px; }
        input:focus,select:focus,button:focus-visible,.resultado-item:focus-visible { outline:3px solid #1e4e8c55; outline-offset:2px; border-color:var(--azul2); }
        .campo-busqueda { position:relative; }
        #resultadosBusqueda { display:none; position:absolute; top:100%; left:0; right:0; max-height:270px; overflow:auto; z-index:5; margin-top:4px; padding:4px; background:#fff; border:1px solid #ccd5df; border-radius:8px; box-shadow:0 8px 20px #0002; }
        .resultado-item { display:block; width:100%; padding:10px 12px; text-align:left; color:var(--texto); background:#fff; border:0; border-radius:6px; cursor:pointer; }
        .resultado-item:hover { background:#f0f4f9; }
        .resultado-item small { display:block; margin-top:3px; color:var(--muted); }
        .acciones { display:flex; justify-content:flex-end; margin-top:16px; }
        .btn-consultar { min-height:44px; padding:10px 20px; color:#fff; background:var(--azul); border:0; border-radius:8px; font-weight:700; cursor:pointer; }
        .btn-consultar:hover { background:var(--azul2); }
        .btn-consultar:disabled { opacity:.6; cursor:wait; }
        .aviso { min-height:24px; margin:18px 0 0; color:var(--muted); font-size:14px; }
        .resumen { margin:20px 0 14px; color:var(--azul); font-size:18px; font-weight:700; }
        .lista { display:grid; gap:12px; }
        .tarjeta { border:1px solid #e0e6ed; border-radius:10px; overflow:hidden; background:#fff; }
        .tarjeta[open] { box-shadow:0 3px 12px #0d2a520d; }
        .tarjeta summary { padding:15px 17px; cursor:pointer; list-style-position:inside; background:#f8fafc; }
        .tarjeta summary::marker { color:var(--azul2); }
        .nombre { display:inline; color:var(--azul); font-size:16px; font-weight:750; }
        .meta { display:block; margin:5px 0 0 20px; color:var(--muted); font-size:13px; }
        .timeline { margin:8px 18px 4px 28px; padding-left:20px; border-left:3px solid var(--azul2); }
        .timeline-item { position:relative; padding:4px 0 19px; }
        .timeline-item::before { position:absolute; top:7px; left:-28px; width:11px; height:11px; content:""; border:3px solid var(--azul); border-radius:50%; background:var(--oro); }
        .anio { display:flex; align-items:center; flex-wrap:wrap; gap:7px; color:var(--azul); font-size:16px; font-weight:750; }
        .detalle { margin-top:5px; color:var(--texto); font-size:14px; line-height:1.55; }
        .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
        .nuevo { background:#e8f0fb; color:var(--azul2); }
        .renovacion { background:#e6f4ea; color:#1e7a34; }
        .inactiva { background:#fbe8e8; color:#a32424; }
        .sin-historial { margin:0 18px 18px 48px; color:var(--muted); font-size:14px; }
        [hidden] { display:none !important; }
        @media(max-width:620px) { body { padding:12px 10px 32px; } .encabezado { padding:22px 20px; } .contenido { padding:20px 16px 24px; } .grid { grid-template-columns:1fr; } .busqueda { padding:16px; } .acciones .btn-consultar { width:100%; } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
    </style>
</head>
<body>
<main class="contenedor">
    <header class="encabezado">
        <h1>🗂️ Historial de Matrícula</h1>
        <p>Colegio Integral Emanuel Matagalpa · CIEM Académico</p>
    </header>
    <section class="contenido" aria-label="Consulta de historiales de matrícula">
        <a href="{{ url_for('admin_dashboard') }}" class="btn-volver">← Volver al panel</a>
        <div class="busqueda">
            <div class="campo">
                <label for="tipoConsulta">Consultar historial por</label>
                <select id="tipoConsulta">
                    <option value="estudiante">Estudiante</option>
                    <option value="grado">Grado</option>
                    <option value="seccion">Sección</option>
                    <option value="todos">Todos los estudiantes</option>
                </select>
            </div>
            <div id="panelEstudiante" class="campo campo-busqueda" style="margin-top:16px">
                <label for="buscarEstudiante">Buscar por nombre o código</label>
                <input type="search" id="buscarEstudiante" placeholder="Escriba al menos dos caracteres…" autocomplete="off" aria-controls="resultadosBusqueda" aria-expanded="false">
                <div id="resultadosBusqueda" role="listbox" aria-label="Estudiantes encontrados"></div>
            </div>
            <div id="panelGrupo" class="grid" style="margin-top:16px" hidden>
                <div class="campo">
                    <label for="grado">Grado</label>
                    <select id="grado">
                        <option value="">Seleccione un grado</option>
                        {% for grado in grados %}<option value="{{ grado }}">{{ grado }}</option>{% endfor %}
                    </select>
                </div>
                <div id="campoSeccion" class="campo" hidden>
                    <label for="seccion">Sección</label>
                    <select id="seccion" disabled><option value="">Primero seleccione un grado</option></select>
                </div>
            </div>
            <div id="accionesGrupo" class="acciones" hidden>
                <button id="consultar" type="button" class="btn-consultar">Consultar historial</button>
            </div>
        </div>
        <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
        <div id="resumen" class="resumen" aria-live="polite"></div>
        <div id="lista" class="lista"></div>
    </section>
</main>
<script>
const seccionesPorGrado = {{ secciones_por_grado|tojson }};
const apiGrupo = {{ url_for('api_historial_matricula_grupo')|tojson }};
const tipoConsulta = document.getElementById("tipoConsulta");
const panelEstudiante = document.getElementById("panelEstudiante");
const panelGrupo = document.getElementById("panelGrupo");
const campoSeccion = document.getElementById("campoSeccion");
const accionesGrupo = document.getElementById("accionesGrupo");
const selectGrado = document.getElementById("grado");
const selectSeccion = document.getElementById("seccion");
const botonConsultar = document.getElementById("consultar");
const inputBuscar = document.getElementById("buscarEstudiante");
const divResultados = document.getElementById("resultadosBusqueda");
const aviso = document.getElementById("aviso");
const resumen = document.getElementById("resumen");
const lista = document.getElementById("lista");
let temporizadorBusqueda = null;
let controladorBusqueda = null;

function limpiarResultados() {
    resumen.textContent = "";
    lista.replaceChildren();
}
function mostrarAviso(texto) { aviso.textContent = texto || ""; }
function crearElemento(etiqueta, clase, texto) {
    const elemento = document.createElement(etiqueta);
    if (clase) elemento.className = clase;
    if (texto !== undefined) elemento.textContent = texto;
    return elemento;
}
function actualizarModo() {
    const modo = tipoConsulta.value;
    const esEstudiante = modo === "estudiante";
    const esGrupo = modo === "grado" || modo === "seccion";
    panelEstudiante.hidden = !esEstudiante;
    panelGrupo.hidden = !esGrupo;
    campoSeccion.hidden = modo !== "seccion";
    accionesGrupo.hidden = modo === "estudiante";
    limpiarResultados();
    mostrarAviso("");
    if (modo === "todos") consultarGrupo();
}
tipoConsulta.addEventListener("change", actualizarModo);

selectGrado.addEventListener("change", function () {
    const secciones = seccionesPorGrado[selectGrado.value] || [];
    selectSeccion.replaceChildren(new Option("Seleccione una sección", ""));
    secciones.forEach(function (valor) { selectSeccion.add(new Option(valor, valor)); });
    selectSeccion.disabled = secciones.length === 0;
    if (!secciones.length) selectSeccion.replaceChildren(new Option("No hay secciones registradas", ""));
});

botonConsultar.addEventListener("click", consultarGrupo);
function consultarGrupo() {
    const modo = tipoConsulta.value;
    if (modo === "grado" && !selectGrado.value) {
        mostrarAviso("Selecciona el grado que quieres consultar.");
        selectGrado.focus();
        return;
    }
    if (modo === "seccion" && (!selectGrado.value || !selectSeccion.value)) {
        mostrarAviso("Selecciona el grado y la sección.");
        (!selectGrado.value ? selectGrado : selectSeccion).focus();
        return;
    }
    const params = new URLSearchParams({tipo: modo});
    if (selectGrado.value) params.set("grado", selectGrado.value);
    if (modo === "seccion") params.set("seccion", selectSeccion.value);
    botonConsultar.disabled = true;
    limpiarResultados();
    mostrarAviso("Cargando historiales…");
    fetch(apiGrupo + "?" + params.toString(), {headers: {"Accept": "application/json"}})
        .then(function (respuesta) {
            if (!respuesta.ok) throw new Error("No se pudieron cargar los historiales.");
            return respuesta.json();
        })
        .then(mostrarGrupo)
        .catch(function (error) { mostrarAviso(error.message); })
        .finally(function () { botonConsultar.disabled = false; });
}

inputBuscar.addEventListener("input", function () {
    const termino = this.value.trim();
    clearTimeout(temporizadorBusqueda);
    if (controladorBusqueda) controladorBusqueda.abort();
    if (termino.length < 2) {
        divResultados.replaceChildren();
        divResultados.style.display = "none";
        inputBuscar.setAttribute("aria-expanded", "false");
        mostrarAviso("");
        return;
    }
    temporizadorBusqueda = setTimeout(function () {
        controladorBusqueda = new AbortController();
        fetch("/admin/api/estudiantes/buscar?q=" + encodeURIComponent(termino), {signal: controladorBusqueda.signal})
            .then(function (respuesta) {
                if (!respuesta.ok) throw new Error("No se pudo completar la búsqueda.");
                return respuesta.json();
            })
            .then(function (estudiantes) {
                divResultados.replaceChildren();
                if (!estudiantes.length) {
                    divResultados.appendChild(crearElemento("div", "resultado-item", "No se encontraron estudiantes."));
                } else {
                    estudiantes.forEach(function (estudiante) {
                        const boton = crearElemento("button", "resultado-item");
                        boton.type = "button";
                        boton.setAttribute("role", "option");
                        boton.dataset.codigo = estudiante.codigo;
                        boton.appendChild(crearElemento("span", "nombre", estudiante.nombre || "(sin nombre)"));
                        const detalle = [estudiante.codigo, estudiante.grado, estudiante.seccion].filter(Boolean).join(" · ");
                        boton.appendChild(crearElemento("small", "", detalle));
                        divResultados.appendChild(boton);
                    });
                }
                divResultados.style.display = "block";
                inputBuscar.setAttribute("aria-expanded", "true");
            })
            .catch(function (error) {
                if (error.name !== "AbortError") mostrarAviso(error.message);
            });
    }, 250);
});

divResultados.addEventListener("click", function (evento) {
    const item = evento.target.closest("button[data-codigo]");
    if (!item) return;
    cargarEstudiante(item.dataset.codigo);
});
function cargarEstudiante(codigo) {
    divResultados.style.display = "none";
    inputBuscar.setAttribute("aria-expanded", "false");
    inputBuscar.value = "";
    limpiarResultados();
    mostrarAviso("Cargando historial del estudiante…");
    fetch("/admin/api/estudiante/" + encodeURIComponent(codigo) + "/historial", {headers: {"Accept": "application/json"}})
        .then(function (respuesta) {
            if (!respuesta.ok) throw new Error("No se pudo cargar el historial del estudiante.");
            return respuesta.json();
        })
        .then(function (datos) {
            mostrarGrupo({titulo: "Historial del estudiante", total: 1, estudiantes: [datos]});
        })
        .catch(function (error) { mostrarAviso(error.message); });
}

function construirTarjeta(estudiante, abierta) {
    const tarjeta = document.createElement("details");
    tarjeta.className = "tarjeta";
    tarjeta.open = abierta;
    const resumenTarjeta = document.createElement("summary");
    resumenTarjeta.appendChild(crearElemento("span", "nombre", estudiante.nombre || "(sin nombre)"));
    const datosActuales = [estudiante.codigo ? "Código: " + estudiante.codigo : "", estudiante.grado || "", estudiante.seccion ? "Sección " + estudiante.seccion : ""].filter(Boolean).join(" · ");
    if (datosActuales) resumenTarjeta.appendChild(crearElemento("span", "meta", datosActuales));
    tarjeta.appendChild(resumenTarjeta);
    if (!estudiante.historial || !estudiante.historial.length) {
        tarjeta.appendChild(crearElemento("p", "sin-historial", "Este estudiante aún no tiene matrículas registradas."));
        return tarjeta;
    }
    const timeline = crearElemento("div", "timeline");
    estudiante.historial.slice().reverse().forEach(function (matricula) {
        const item = crearElemento("div", "timeline-item");
        const encabezado = crearElemento("div", "anio", matricula.anio_lectivo || "Año no especificado");
        const claseTipo = matricula.tipo_matricula === "renovacion" ? "renovacion" : "nuevo";
        const textoTipo = matricula.tipo_matricula === "renovacion" ? "Renovación" : "Nuevo ingreso";
        encabezado.appendChild(crearElemento("span", "badge " + claseTipo, textoTipo));
        if (matricula.estado && matricula.estado !== "activa") {
            encabezado.appendChild(crearElemento("span", "badge inactiva", matricula.estado));
        }
        item.appendChild(encabezado);
        const partes = ["Grado: " + (matricula.grado || "—"), "Sección: " + (matricula.seccion || "—")];
        if (matricula.fecha_matricula) partes.push("Matriculado el " + matricula.fecha_matricula);
        item.appendChild(crearElemento("div", "detalle", partes.join(" · ")));
        timeline.appendChild(item);
    });
    tarjeta.appendChild(timeline);
    return tarjeta;
}
function mostrarGrupo(datos) {
    limpiarResultados();
    const estudiantes = datos.estudiantes || [];
    resumen.textContent = (datos.titulo || "Historial") + " · " + (datos.total || estudiantes.length) + (estudiantes.length === 1 ? " estudiante" : " estudiantes");
    if (!estudiantes.length) {
        mostrarAviso("No hay estudiantes o matrículas para esta selección.");
        return;
    }
    mostrarAviso("");
    const abrirTarjetas = estudiantes.length <= 12;
    estudiantes.forEach(function (estudiante) {
        lista.appendChild(construirTarjeta(estudiante, abrirTarjetas));
    });
}

const codigoInicial = {{ codigo_inicial|tojson }};
actualizarModo();
if (codigoInicial) cargarEstudiante(codigoInicial);
</script>
</body>
</html>
