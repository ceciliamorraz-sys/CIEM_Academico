<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
Agregar Estudiante | CIEM Académico
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{

background:#f5f7fb;
font-family:'Segoe UI',sans-serif;

}


.card{

border:none;
border-radius:20px;

}


.header{

background:linear-gradient(135deg,#08142C,#1E4E8C);
color:white;
padding:25px;
border-radius:20px;

}


.btn-ciem{

background:#0D2A52;
color:white;

}


.btn-ciem:hover{

background:#1E4E8C;
color:white;

}

</style>


</head>


<body>


<div class="container mt-5">


<div class="header mb-4">

<h2>
➕ Registrar Estudiante
</h2>

<p>
Nuevo estudiante CIEM Académico
</p>

</div>



<div class="card shadow">


<div class="card-body">


<form method="POST">



<div class="row">



<div class="col-md-4 mb-3">

<label>
Código
</label>

<input type="text"
name="codigo"
class="form-control"
required>

</div>




<div class="col-md-8 mb-3">

<label>
Nombre completo
</label>

<input type="text"
name="nombre"
class="form-control"
required>

</div>




<div class="col-md-4 mb-3">

<label>
Fecha nacimiento
</label>

<input type="date"
name="fecha_nacimiento"
class="form-control">

</div>




<div class="col-md-2 mb-3">

<label>
Grado
</label>

<input type="text"
name="grado"
class="form-control">

</div>




<div class="col-md-2 mb-3">

<label>
Sección
</label>

<input type="text"
name="seccion"
class="form-control">

</div>




<div class="col-md-4 mb-3">

<label>
Padre / Tutor
</label>

<input type="text"
name="padre"
class="form-control">

</div>




<div class="col-md-4 mb-3">

<label>
Teléfono
</label>

<input type="text"
name="telefono"
class="form-control">

</div>




<div class="col-md-4 mb-3">

<label>
Usuario
</label>

<input type="text"
name="usuario"
class="form-control">

</div>




<div class="col-md-4 mb-3">

<label>
Contraseña
</label>

<input type="text"
name="password"
class="form-control">

</div>


</div>



<button class="btn btn-ciem">

💾 Guardar estudiante

</button>


<a href="{{ url_for('listar_estudiantes_admin') }}"
class="btn btn-secondary">

Cancelar

</a>


</form>


</div>


</div>


</div>


</body>

</html>
