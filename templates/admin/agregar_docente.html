<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agregar Docente | CIEM Académico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:#f1f5f9;
font-family:'Segoe UI',sans-serif;

}


.card{

border:none;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}


.header{

background:#08142C;
color:white;
padding:25px;
border-radius:20px;

}


.btn-ciem{

background:#2563eb;
color:white;

}


.btn-ciem:hover{

background:#1d4ed8;
color:white;

}

</style>


</head>


<body>


<div class="container mt-4">


<div class="header mb-4">


<h2>
👩‍🏫 Registrar Nuevo Docente
</h2>


<p>
CIEM Académico - Administración docente
</p>


</div>



<div class="card">


<div class="card-body">



<form method="POST">



<div class="row">



<div class="col-md-6 mb-3">

<label>
Código
</label>

<input type="text"
name="codigo"
class="form-control"
placeholder="Ejemplo DOC015"
required>

</div>




<div class="col-md-6 mb-3">

<label>
Nombre completo
</label>

<input type="text"
name="nombre"
class="form-control"
required>

</div>




<div class="col-md-6 mb-3">

<label>
Usuario
</label>

<input type="text"
name="usuario"
class="form-control"
required>

</div>





<div class="col-md-6 mb-3">

<label>
Teléfono
</label>

<input type="text"
name="telefono"
class="form-control">

</div>





<div class="col-md-6 mb-3">

<label>
Nivel
</label>


<select name="nivel"
class="form-control">


<option value="Preescolar">
Preescolar
</option>


<option value="Primaria">
Primaria
</option>


<option value="Secundaria">
Secundaria
</option>


<option value="Todos">
Todos
</option>


<option value="Administrativo">
Administrativo
</option>


</select>


</div>





<div class="col-md-6 mb-3">

<label>
Tipo Docente
</label>


<select name="tipo_docente"
class="form-control">


<option value="guia">
Docente Guía
</option>


<option value="especialista">
Especialista
</option>


<option value="apoyo">
Apoyo
</option>


<option value="administrativo">
Administrativo
</option>


</select>


</div>






<div class="col-md-6 mb-3">

<label>
Cargo
</label>

<input type="text"
name="cargo"
class="form-control"
placeholder="Ejemplo Docente Primer Grado">


</div>





<div class="col-md-6 mb-3">

<label>
Especialidad
</label>


<input type="text"
name="especialidad"
class="form-control"
placeholder="Matemática, Inglés, etc">


</div>



</div>





<button type="submit"
class="btn btn-ciem">

💾 Guardar Docente

</button>



<a href="{{ url_for('listar_docentes') }}"
class="btn btn-secondary">

Cancelar

</a>




</form>



</div>


</div>



</div>



</body>

</html>
