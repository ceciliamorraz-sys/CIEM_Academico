```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
CIEM Académico | Editar Estudiante
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<style>

body{

    background:#f5f7fb;
    font-family:"Segoe UI",sans-serif;

}


.card{

    border:none;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);

}


.header{

    background:linear-gradient(135deg,#08142C,#1E4E8C);
    color:white;
    padding:25px;
    border-radius:20px 20px 0 0;

}


.btn-ciem{

    background:#0D2A52;
    color:white;

}


.btn-ciem:hover{

    background:#1E4E8C;
    color:white;

}


.form-control,
.form-select{

    border-radius:12px;
    padding:12px;

}


label{

    font-weight:600;

}


</style>


</head>


<body>


<div class="container py-5">



<div class="card">


<div class="header">

<h2>

<i class="bi bi-pencil-square"></i>

Editar estudiante

</h2>

<p class="mb-0">

Actualización de información académica

</p>

</div>




<div class="card-body p-4">



<form method="POST">



<div class="row">



<div class="col-md-6 mb-3">


<label>

Nombre completo

</label>


<input type="text"
name="nombre"
class="form-control"
value="{{ estudiante.nombre }}"
required>


</div>





<div class="col-md-6 mb-3">


<label>

Código estudiante

</label>


<input type="text"
name="codigo"
class="form-control"
value="{{ estudiante.codigo }}">


</div>





<div class="col-md-6 mb-3">


<label>

Grado

</label>


<input type="text"
name="grado"
class="form-control"
value="{{ estudiante.grado }}">


</div>





<div class="col-md-6 mb-3">


<label>

Sección

</label>


<input type="text"
name="seccion"
class="form-control"
value="{{ estudiante.seccion }}">


</div>





<div class="col-md-6 mb-3">


<label>

Padre / Tutor

</label>


<input type="text"
name="padre"
class="form-control"
value="{{ estudiante.padre }}">


</div>





<div class="col-md-6 mb-3">


<label>

Teléfono

</label>


<input type="text"
name="telefono"
class="form-control"
value="{{ estudiante.telefono }}">


</div>




</div>




<div class="d-flex justify-content-between mt-4">


<a href="{{ url_for('listar_estudiantes_admin') }}"
class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Cancelar

</a>




<button type="submit"
class="btn btn-ciem">

<i class="bi bi-save"></i>

Guardar cambios

</button>



</div>



</form>



</div>


</div>



</div>


</body>

</html>
```
