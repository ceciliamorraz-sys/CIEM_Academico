<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
Nueva Asignatura | CIEM Académico
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:#f1f5f9;
font-family:'Segoe UI',sans-serif;

}


.header{

background:linear-gradient(135deg,#08142C,#1E4E8C);
color:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.15);

}


.card{

border:none;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}


label{

font-weight:600;

}


.btn-ciem{

background:#2563eb;
color:white;

}


.btn-ciem:hover{

background:#1d4ed8;
color:white;

}


.form-control,
.form-select{

border-radius:10px;

}


</style>


</head>



<body>


<div class="container mt-4">



<!-- ENCABEZADO -->

<div class="header mb-4">


<div class="d-flex justify-content-between align-items-center">


<div>

<h2>
📚 Nueva Asignatura
</h2>


<p class="mb-0">
Registro académico CIEM Académico
</p>


</div>



<a href="{{ url_for('listar_asignaturas') }}"
class="btn btn-light">

⬅ Regresar

</a>


</div>


</div>





<!-- FORMULARIO -->


<div class="card">


<div class="card-body p-4">


<form method="POST">



<div class="row">



<!-- CODIGO -->


<div class="col-md-6 mb-3">


<label>
Código
</label>


<input type="text"
name="codigo"
class="form-control"
placeholder="MAT001"
required>


</div>





<!-- NOMBRE -->


<div class="col-md-6 mb-3">


<label>
Nombre Asignatura
</label>


<input type="text"
name="nombre"
class="form-control"
placeholder="Matemática"
required>


</div>






<!-- NIVEL -->


<div class="col-md-6 mb-3">


<label>
Nivel
</label>


<select name="nivel"
class="form-select"
required>


<option value="">
Seleccione nivel
</option>


<option>
Preescolar
</option>


<option>
Primaria
</option>


<option>
Secundaria
</option>


</select>


</div>







<!-- GRADO -->


<div class="col-md-6 mb-3">


<label>
Grado
</label>


<input type="text"
name="grado"
class="form-control"
placeholder="Ejemplo: 1, 2, 3">


</div>








<!-- DOCENTE -->


<div class="col-md-6 mb-3">


<label>
Docente Responsable
</label>



<select name="docente_id"
class="form-select"
required>



<option value="">
Seleccione docente
</option>




{% for d in docentes %}



<option value="{{ d._id }}">

{{ d.nombre }} - {{ d.cargo }}

</option>



{% endfor %}



</select>



</div>



<hr>



<button type="submit"
class="btn btn-ciem">

💾 Guardar Asignatura

</button>



<a href="{{ url_for('listar_asignaturas') }}"
class="btn btn-secondary">

Cancelar

</a>




</form>



</div>


</div>



</div>



</body>

</html>
