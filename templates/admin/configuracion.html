<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Configuración | CIEM Académico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --dark:#0D2A52;
    --dark-2:#1E4E8C;
    --gold:#D4AF37;
    --gold-2:#B8860B;
    --navy:#08142C;
    --bg:#f1f5f9;
}

body{
    background:var(--bg);
    font-family:'Inter','Segoe UI',sans-serif;
}

.container{
    max-width:520px;
}

.card-header-custom{
    background:linear-gradient(135deg,var(--dark),var(--dark-2));
    color:white;
    border-radius:18px 18px 0 0;
    padding:24px;
}

.card{
    border:none;
    border-radius:18px;
    overflow:hidden;
}

.btn-gold{
    background:var(--gold);
    border:none;
    color:var(--navy);
    font-weight:600;
}

.btn-gold:hover{
    background:var(--gold-2);
    color:white;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="mb-3">
<a href="{{ url_for('admin_dashboard') }}" class="btn btn-light btn-sm">
⬅ Regresar al dashboard
</a>
</div>

<div class="card shadow">

<div class="card-header-custom">
<h4 class="mb-0">⚙️ Configuración de cuenta</h4>
<small>Usuario: {{ usuario }}</small>
</div>

<div class="card-body p-4">

{% with mensajes = get_flashed_messages(with_categories=true) %}
{% if mensajes %}
{% for categoria, mensaje in mensajes %}
<div class="alert alert-{{ categoria }}">
{{ mensaje }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">
<label class="form-label">Contraseña actual</label>
<input type="password" name="password_actual" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Nueva contraseña</label>
<input type="password" name="password_nueva" class="form-control" required minlength="4">
</div>

<div class="mb-4">
<label class="form-label">Confirmar nueva contraseña</label>
<input type="password" name="password_confirmar" class="form-control" required minlength="4">
</div>

<button type="submit" class="btn btn-gold w-100">
Guardar cambios
</button>

</form>

</div>

</div>

</div>

</body>

</html>
