<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>

@page {
    size: letter;
    margin: 2cm 1.5cm;
}

body{
    font-family:'Helvetica','Arial',sans-serif;
    color:#0D2A52;
    font-size:11px;
}

.header{
    text-align:center;
    margin-bottom:16px;
}

.header img{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-bottom:6px;
}

.header h1{
    font-size:16px;
    margin:4px 0 0;
    color:#0D2A52;
}

.header h2{
    font-size:12px;
    font-weight:normal;
    margin:2px 0 0;
    color:#1E4E8C;
}

.linea-dorada{
    border:none;
    border-top:2px solid #D4AF37;
    margin:10px 0 16px;
}

.fecha-generado{
    text-align:right;
    font-size:9px;
    color:#64748b;
    margin-bottom:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0D2A52;
    color:white;
    text-align:left;
    padding:6px 8px;
    font-size:10px;
}

td{
    padding:5px 8px;
    border-bottom:1px solid #e2e8f0;
}

tr:nth-child(even) td{
    background:#f8fafc;
}

.footer{
    margin-top:14px;
    text-align:center;
    font-size:8.5px;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="header">
<img src="{{ url_for('static', filename='img/logo.jpg') }}">
<h1>COLEGIO INTEGRAL EMANUEL</h1>
<h2>Reporte de Matrículas</h2>
</div>

<hr class="linea-dorada">

<div class="fecha-generado">
Generado: {{ fecha_generado }}
</div>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Estudiante</th>
<th>Grado</th>
<th>Estado</th>
</tr>
</thead>

<tbody>

{% for m in matriculas %}
<tr>
<td>{{ m.fecha_matricula }}</td>
<td>{{ m.estudiante.nombre if m.estudiante else '-' }}</td>
<td>{{ m.grado }}</td>
<td>Activo</td>
</tr>
{% endfor %}

</tbody>

</table>

<div class="footer">
Total de matrículas: {{ matriculas|length }}
</div>

</body>
</html>
