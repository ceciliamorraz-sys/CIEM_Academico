<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Académico | CIEM
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:#f1f5f9;
font-family:'Segoe UI';

}


.header{

background:linear-gradient(135deg,#08142C,#1E4E8C);
color:white;
padding:30px;
border-radius:20px;

}


.card{

border:none;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

</style>

</head>


<body>


<div class="container mt-4">


<div class="header mb-4">


<h2>
📊 Reporte Académico
</h2>


<p>
Rendimiento académico CIEM
</p>


<a href="{{ url_for('admin_dashboard') }}"
class="btn btn-light">

⬅ Regresar al Dashboard

</a>


</div>



<div class="card">

<div class="card-body">


<h4>
Información Académica
</h4>


<hr>


<table class="table table-bordered">


<thead class="table-dark">

<tr>

<th>
Estudiante
</th>


<th>
Asignatura
</th>


<th>
Promedio
</th>


<th>
Estado
</th>


</tr>

</thead>


<tbody>


{% for r in reportes %}


<tr>


<td>
{{ r.estudiante }}
</td>


<td>
{{ r.asignatura }}
</td>


<td>
{{ r.promedio }}
</td>


<td>

{% if r.promedio >= 60 %}

<span class="badge bg-success">
Aprobado
</span>

{% else %}

<span class="badge bg-danger">
Reprobado
</span>

{% endif %}


</td>


</tr>


{% endfor %}


</tbody>


</table>


</div>

</div>


</div>


</body>

</html>
