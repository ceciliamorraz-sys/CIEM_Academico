<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Docentes
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">


<h3 class="mb-0">
👨‍🏫 Reporte de Docentes
</h3>


<div>

<a href="{{ url_for('admin_dashboard') }}"
   class="btn btn-light">
    ⬅ Regresar
</a>

<a href="{{ url_for('reporte_docentes_pdf') }}"
   class="btn btn-warning">
    ⬇ Descargar PDF
</a>

</div>


</div>




<div class="card-body">



<table class="table table-striped">


<thead>


<tr>

<th>
Código
</th>


<th>
Nombre
</th>


<th>
Cargo
</th>


<th>
Especialidad
</th>


<th>
Nivel
</th>


<th>
Teléfono
</th>


<th>
Estado
</th>


</tr>


</thead>



<tbody>



{% for d in docentes %}



<tr>


<td>
{{ d.codigo }}
</td>


<td>
{{ d.nombre }}
</td>


<td>
{{ d.cargo }}
</td>


<td>
{{ d.especialidad }}
</td>


<td>
{{ d.nivel }}
</td>


<td>
{{ d.telefono }}
</td>


<td>

{% if d.activo %}
<span class="badge bg-success">Activo</span>
{% else %}
<span class="badge bg-secondary">Inactivo</span>
{% endif %}

</td>



</tr>



{% endfor %}



</tbody>


</table>



</div>



</div>


</div>


</body>


</html>
