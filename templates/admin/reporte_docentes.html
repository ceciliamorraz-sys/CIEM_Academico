<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Docentes | CIEM Académico
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:#f1f5f9;
font-family:'Segoe UI';

}


.card{

border:none;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}


.header{

background:linear-gradient(135deg,#08142C,#1E4E8C);
color:white;
padding:25px;
border-radius:20px;

}


</style>


</head>


<body>


<div class="container mt-4">


<div class="header mb-4">


<h2>
👨‍🏫 Reporte de Docentes
</h2>


<p>
Listado general del personal docente CIEM
</p>


<a href="{{ url_for('admin_dashboard') }}"
class="btn btn-light">

⬅ Regresar al Dashboard

</a>


</div>





<div class="card">

<div class="card-body">



<table class="table table-striped">


<thead class="table-dark">

<tr>

<th>
Nombre
</th>


<th>
Cargo
</th>


<th>
Especialidad
</th>


<th>
Teléfono
</th>


</tr>


</thead>



<tbody>


{% for d in docentes %}


<tr>

<td>
{{ d.nombre }}
</td>


<td>
{{ d.cargo }}
</td>


<td>
{{ d.especialidad if d.especialidad else '-' }}
</td>


<td>
{{ d.telefono if d.telefono else '-' }}
</td>


</tr>


{% endfor %}


</tbody>


</table>



</div>


</div>


</div>


</body>

</html>
