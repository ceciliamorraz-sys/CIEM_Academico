<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Estudiantes | CIEM
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>


<body class="bg-light">


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<h3>
🎓 Reporte de Estudiantes
</h3>


<a href="{{ url_for('admin_dashboard') }}"
class="btn btn-light">

⬅ Regresar al Dashboard

</a>


</div>



<div class="card-body">


<table class="table table-bordered">


<tr class="table-dark">

<th>
Código
</th>

<th>
Nombre
</th>

<th>
Grado
</th>

<th>
Sección
</th>

</tr>



{% for e in estudiantes %}


<tr>


<td>
{{ e.codigo }}
</td>


<td>
{{ e.nombre }}
</td>


<td>
{{ e.grado }}
</td>


<td>
{{ e.seccion }}
</td>


</tr>


{% endfor %}


</table>


</div>


</div>


</div>


</body>


</html>
