<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Estudiantes
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">


<h3 class="mb-0">
📚 Reporte de Estudiantes
</h3>


<div>

<a href="{{ url_for('admin_dashboard') }}"
   class="btn btn-light">
    ⬅ Regresar
</a>

<a href="{{ url_for('reporte_estudiantes_pdf') }}"
   class="btn btn-warning">
    ⬇ Descargar PDF
</a>

</div>


</div>




<div class="card-body">



<table class="table table-striped">


<thead>


<tr>

<th>
Código
</th>


<th>
Nombre
</th>


<th>
Grado
</th>


<th>
Sección
</th>


</tr>


</thead>



<tbody>



{% for e in estudiantes %}



<tr>


<td>
{{ e.codigo }}
</td>


<td>
{{ e.nombre }}
</td>


<td>
{{ e.grado }}
</td>


<td>
{{ e.seccion }}
</td>


</tr>



{% endfor %}



</tbody>


</table>



</div>



</div>


</div>


</body>


</html>
