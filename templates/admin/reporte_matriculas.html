<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Reporte Matrículas
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-4">


<div class="card shadow">


<div class="card-header bg-dark text-white">


<h3>
📚 Reporte de Matrículas 2026
</h3>



<a href="{{ url_for('admin_dashboard') }}"
   class="btn btn-light">
    ⬅ Regresar
</a>

<a href="{{ url_for('reporte_matriculas_pdf') }}"
   class="btn btn-warning">
    ⬇ Descargar PDF
</a>



</div>




<div class="card-body">



<table class="table table-striped">


<thead>


<tr>

<th>
Fecha
</th>


<th>
Estudiante
</th>


<th>
Grado
</th>


<th>
Estado
</th>


</tr>


</thead>



<tbody>



{% for m in matriculas %}



<tr>


<td>
{{ m.fecha_matricula }}
</td>


<td>
{{ m.estudiante.nombre if m.estudiante else '-' }}
</td>


<td>
{{ m.grado }}
</td>


<td>

<span class="badge bg-success">

Activo

</span>

</td>



</tr>



{% endfor %}



</tbody>


</table>



</div>



</div>


</div>


</body>


</html>
