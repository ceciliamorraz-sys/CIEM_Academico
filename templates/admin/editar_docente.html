<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Editar Docente</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<h2>
✏️ Editar Docente
</h2>


<form method="POST">


<div class="mb-3">

<label>Nombre</label>

<input 
class="form-control"
name="nombre"
value="{{ docente.nombre }}">

</div>



<div class="mb-3">

<label>Usuario</label>

<input 
class="form-control"
name="usuario"
value="{{ docente.usuario }}">

</div>



<div class="mb-3">

<label>Especialidad</label>

<input 
class="form-control"
name="especialidad"
value="{{ docente.especialidad }}">

</div>



<div class="mb-3">

<label>Teléfono</label>

<input 
class="form-control"
name="telefono"
value="{{ docente.telefono }}">

</div>



<button class="btn btn-primary">

Guardar cambios

</button>


<a href="{{ url_for('listar_docentes') }}"
class="btn btn-secondary">

Cancelar

</a>


</form>


</div>


</body>

</html>
