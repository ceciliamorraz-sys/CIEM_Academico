<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CIEM Académico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        body{
            margin:0;
            font-family:'Poppins', sans-serif;
            background: linear-gradient(135deg, #0b1f3a, #0f172a);
        }

        /* ====== HEADER ====== */
        .header{
            background:#0f172a;
            padding:15px 30px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            color:white;
        }

        .header img{
            width:55px;
            border-radius:8px;
        }

        .header h1{
            font-size:18px;
            margin:0;
        }

        /* ====== CONTENIDO PRINCIPAL ====== */
        .main{
            display:flex;
            justify-content:center;
            align-items:center;
            padding:60px 20px;
        }

        /* ====== LOGIN ====== */
        .login-card{
            width:100%;
            max-width:400px;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .logo{
            width:90px;
            border-radius:10px;
        }

        .title{
            font-weight:600;
            color:#1e3a8a;
            margin-top:10px;
        }

        .subtitle{
            font-size:13px;
            color:#6b7280;
        }

        label{
            font-size:14px;
        }

        .form-control{
            border-radius:10px;
            padding:10px;
        }

        .btn-primary{
            background:#1e3a8a;
            border:none;
            border-radius:10px;
            padding:10px;
        }

        .btn-primary:hover{
            background:#0f172a;
        }

        .alert{
            border-radius:10px;
        }

        /* ====== FOOTER ====== */
        .footer{
            text-align:center;
            color:white;
            padding:20px;
            font-size:13px;
        }

    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">

    <div class="d-flex align-items-center gap-2">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}">
        <h1>CIEM Académico</h1>
    </div>

    <div>
        Colegio Integral Emanuel Matagalpa
    </div>

</div>

<!-- ===== CONTENIDO ===== -->
<div class="main">

    <div class="login-card">

        <div class="text-center">

            <img src="{{ url_for('static', filename='img/logo.jpg') }}"
                 class="logo">

            <h4 class="title">Bienvenido</h4>

            <p class="subtitle">Inicia sesión en el sistema académico</p>

        </div>

        <form method="POST">

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="usuario" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100">
                Ingresar
            </button>

        </form>

    </div>

</div>

<!-- ===== FOOTER ===== -->
<div class="footer">
    © 2026 Colegio Integral Emanuel - Sistema Académico
</div>

</body>
</html>
