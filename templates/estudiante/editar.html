<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            max-width:700px;
            margin:40px auto;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3 class="text-center">
                ✏️ Editar Estudiante
            </h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text"
                           name="codigo"
                           class="form-control"
                           value="{{ estudiante.codigo }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           name="nombre"
                           class="form-control"
                           value="{{ estudiante.nombre }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date"
                           name="fecha_nacimiento"
                           class="form-control"
                           value="{{ estudiante.fecha_nacimiento }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Grado</label>
                    <input type="text"
                           name="grado"
                           class="form-control"
                           value="{{ estudiante.grado }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sección</label>
                    <input type="text"
                           name="seccion"
                           class="form-control"
                           value="{{ estudiante.seccion }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Padre o Tutor</label>
                    <input type="text"
                           name="padre"
                           class="form-control"
                           value="{{ estudiante.padre }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text"
                           name="usuario"
                           class="form-control"
                           value="{{ estudiante.usuario }}"
                           required>
                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('listar_estudiantes') }}"
                       class="btn btn-secondary">
                        ← Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        💾 Guardar Cambios
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
