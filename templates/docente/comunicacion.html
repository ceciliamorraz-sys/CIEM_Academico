<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Comunicación Padres | CIEM Académico
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/clases.css') }}">


</head>


<body>


<div class="container-fluid py-4">



<!-- ENCABEZADO -->

<div class="header-clases">


<div>

<h2>

<i class="bi bi-chat-dots"></i>

Comunicación con Padres

</h2>


<p>

Envío de mensajes y seguimiento académico

</p>


</div>



<a href="{{ url_for('docente.dashboard_docente') }}"
class="btn btn-light">

<i class="bi bi-arrow-left"></i>

Volver

</a>



</div>





<!-- FORMULARIO -->


<div class="card panel mt-4">


<div class="card-body">



<form method="POST"
action="{{ url_for('docente.guardar_comunicacion') }}">





<div class="row g-3">



<div class="col-md-6">


<label class="form-label">

Estudiante

</label>


<select 
class="form-select"
id="estudiante"
onchange="mostrarPadre()"
required>


<option value="">

Seleccione estudiante

</option>



{% for e in estudiantes %}


<option 
value="{{ e.padre }}"
data-padre="{{ e.padre }}">


{{ e.nombre }}


</option>



{% endfor %}



</select>



</div>






<div class="col-md-6">


<label class="form-label">

Padre / Tutor

</label>


<input 
type="text"
class="form-control"
name="padre"
id="padre"
readonly>


</div>



</div>







<div class="mt-4">


<label class="form-label">

Mensaje

</label>



<textarea

class="form-control"

name="mensaje"

rows="5"

placeholder="Escriba el mensaje para el padre de familia..."

required></textarea>



</div>








<div class="mt-4">


<button 
class="btn btn-primary">


<i class="bi bi-send"></i>

Enviar comunicación


</button>



</div>





</form>



</div>


</div>






</div>







<script>


function mostrarPadre(){


let estudiante=document.getElementById("estudiante");


let padre=estudiante.options[
estudiante.selectedIndex
].getAttribute("data-padre");



document.getElementById("padre").value=padre;



}


</script>



</body>

</html>
