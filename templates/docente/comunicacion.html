```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Comunicación Madres | CIEM Académico
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/clases.css') }}"
    >

</head>


<body>


<div class="container-fluid py-4">


    <!-- ==================================================
         ENCABEZADO
    ================================================== -->

    <div class="header-clases">


        <div>

            <h2>

                <i class="bi bi-chat-dots"></i>

                Comunicación con Madres

            </h2>


            <p>

                Envío de mensajes y seguimiento académico

            </p>

        </div>


        <a
            href="{{ url_for('docente.dashboard_docente') }}"
            class="btn btn-light"
        >

            <i class="bi bi-arrow-left"></i>

            Volver

        </a>


    </div>


    <!-- ==================================================
         FORMULARIO
    ================================================== -->

    <div class="card panel mt-4">


        <div class="card-body">


            <form
                method="POST"
                action="{{ url_for('docente.guardar_comunicacion') }}"
            >


                <div class="row g-3">


                    <!-- ==================================
                         ESTUDIANTE
                    =================================== -->

                    <div class="col-md-6">


                        <label
                            class="form-label"
                            for="estudiante"
                        >

                            Estudiante

                        </label>


                        <select
                            class="form-select"
                            id="estudiante"
                            name="estudiante"
                            onchange="mostrarMadre()"
                            required
                        >


                            <option value="">

                                Seleccione estudiante

                            </option>


                            {% for e in estudiantes %}


                                <option
                                    value="{{ e.get('_id', '') }}"
                                    data-madre="{{ e.get('madre', '') }}"
                                >

                                    {{ e.get('nombre', 'Estudiante') }}

                                </option>


                            {% endfor %}


                        </select>


                    </div>


                    <!-- ==================================
                         MADRE
                    =================================== -->

                    <div class="col-md-6">


                        <label
                            class="form-label"
                            for="madre"
                        >

                            Madre

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            name="madre"
                            id="madre"
                            readonly
                            placeholder="La madre aparecerá aquí"
                        >


                    </div>


                </div>


                <!-- ======================================
                     MENSAJE
                ======================================= -->

                <div class="mt-4">


                    <label
                        class="form-label"
                        for="mensaje"
                    >

                        Mensaje

                    </label>


                    <textarea
                        class="form-control"
                        name="mensaje"
                        id="mensaje"
                        rows="5"
                        placeholder="Escriba el mensaje para la madre de familia..."
                        required
                    ></textarea>


                </div>


                <!-- ======================================
                     BOTÓN
                ======================================= -->

                <div class="mt-4">


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="bi bi-send"></i>

                        Enviar comunicación

                    </button>


                </div>


            </form>


        </div>


    </div>


</div>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>

function mostrarMadre() {

    const estudiante =
        document.getElementById("estudiante");

    const opcion =
        estudiante.options[
            estudiante.selectedIndex
        ];


    const madre =
        opcion.getAttribute("data-madre");


    document.getElementById("madre").value =
        madre || "";

}

</script>


</body>

</html>
```
