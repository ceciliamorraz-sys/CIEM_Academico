<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Seleccionar Asistencia | CIEM
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/clases.css') }}">


</head>


<body>


<div class="container py-5">



<div class="header-clases">


<div>


<h2>

<i class="bi bi-calendar-check"></i>

Asistencia

</h2>


<p>
Seleccione la asignatura para tomar asistencia
</p>


</div>




<a href="{{ url_for('docente.dashboard_docente') }}"
class="btn btn-light">


<i class="bi bi-arrow-left"></i>

Volver


</a>



</div>







<div class="row g-4 mt-4">





{% for clase in clases %}



<div class="col-md-4">



<div class="clase-card">



<div class="icono">


<i class="bi bi-mortarboard-fill"></i>


</div>




<h4>

{{ clase.nombre }}

</h4>





<div class="datos">



<p>

<i class="bi bi-mortarboard"></i>


Grado:

<strong>

{{ clase.grado }}

</strong>


</p>





<p>

<i class="bi bi-people"></i>


Sección:

<strong>

{{ clase.seccion }}

</strong>


</p>




</div>







<a href="{{ url_for('docente.asistencia',
asignatura_id=clase._id) }}"
class="btn btn-success">


<i class="bi bi-calendar-check"></i>


Tomar asistencia


</a>




</div>



</div>




{% else %}



<div class="col-12">


<div class="alert alert-warning">

No tiene asignaturas asignadas.

</div>


</div>



{% endfor %}





</div>



</div>



</body>


</html>
