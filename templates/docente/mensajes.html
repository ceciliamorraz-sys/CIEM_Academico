<!DOCTYPE html>
<html lang="es">

<head>

<title>
Mensajes de Padres
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>

📩 Mensajes de padres

</h2>



{% for m in mensajes %}


<div class="card mt-3">


<div class="card-body">


<h5>

Estudiante:

{{m.estudiante}}

</h5>


<p>

Padre:

{{m.padre}}

</p>


<p>

Mensaje:

</p>


<div class="alert alert-light">

{{m.mensaje}}

</div>



<small>

Estado:

{{m.estado}}

</small>



</div>


</div>



{% else %}


<div class="alert alert-info">

No hay mensajes pendientes

</div>


{% endfor %}



</div>


</body>

</html>
