<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Boletín académico</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body class="bg-light">


<div class="container mt-4">


<div class="card shadow p-4">


<h2>

📄 Boletín Académico

</h2>


<hr>


<h4>

{{ estudiante.nombre }}

</h4>


<p>

<strong>Grado:</strong>
{{ estudiante.grado }}

<br>

<strong>Sección:</strong>
{{ estudiante.seccion }}

</p>



<table class="table table-bordered mt-4">


<thead class="table-dark">


<tr>

<th>
Asignatura
</th>

<th>
Nota
</th>

<th>
Periodo
</th>


</tr>


</thead>



<tbody>


{% for nota in notas %}


<tr>


<td>

{{ nota.asignatura }}

</td>


<td>

{{ nota.nota }}

</td>


<td>

{{ nota.periodo }}

</td>


</tr>



{% else %}


<tr>

<td colspan="3"

class="text-center">

No hay calificaciones registradas.

</td>


</tr>


{% endfor %}


</tbody>



</table>



<a href="{{ url_for('docente.estudiantes') }}"

class="btn btn-primary">

Regresar

</a>


</div>


</div>


</body>

</html>
