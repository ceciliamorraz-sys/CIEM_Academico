<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Registrar Incidencia | CIEM
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/clases.css') }}">


</head>


<body>


<div class="container-fluid py-4">



<!-- ENCABEZADO -->

<div class="header-clases">


<div>


<h2>

<i class="bi bi-exclamation-triangle"></i>

Registro de Incidencias

</h2>


<p>

{{ asignatura.nombre }}

|

Grado {{ asignatura.grado }}

|

Sección {{ asignatura.seccion }}

</p>


</div>




<a href="{{ url_for('docente.lista_incidencias') }}"
class="btn btn-light">

<i class="bi bi-arrow-left"></i>

Volver

</a>


</div>





<div class="card mt-4 panel">


<div class="card-body">



<form method="POST"
action="{{ url_for('docente.guardar_incidencia') }}">



<input type="hidden"
name="asignatura_id"
value="{{ asignatura._id }}">






<div class="row">



<div class="col-md-6">



<label class="form-label">

Estudiante

</label>


<select class="form-select"
name="estudiante_id"
required>


<option value="">

Seleccione estudiante

</option>



{% for e in estudiantes %}


<option value="{{ e.codigo }}">

{{ e.nombre }}

-
Grado {{ e.grado }}

</option>


{% endfor %}



</select>


</div>





<div class="col-md-6">


<label class="form-label">

Fecha

</label>


<input type="date"
class="form-control"
name="fecha"
value="{{ fecha if fecha else '' }}"
required>


</div>


</div>







<div class="mt-3">


<label class="form-label">

Tipo de incidencia

</label>


<select class="form-select"
name="tipo">


<option value="disciplina">

Disciplina

</option>


<option value="academica">

Académica

</option>


<option value="asistencia">

Asistencia

</option>


<option value="otra">

Otra

</option>


</select>


</div>








<div class="mt-3">


<label class="form-label">

Descripción

</label>


<textarea
class="form-control"
rows="4"
name="descripcion"
placeholder="Detalle la incidencia..."
required></textarea>


</div>







<div class="mt-4">


<button class="btn btn-warning">

<i class="bi bi-save"></i>

Guardar incidencia

</button>



</div>



</form>



</div>


</div>





</div>



</body>

</html>
