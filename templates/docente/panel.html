<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Docente</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

/* CONTENEDOR PRINCIPAL GRANDE */
.panel-container{
    background:white;
    margin:30px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* SELECT */
.select-box{
    width:250px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* TABLA */
.table-container{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    margin-top:20px;
}

/* TÍTULOS DE SECCIÓN */
.section-title{
    font-weight:bold;
    font-size:18px;
    margin-bottom:10px;
    color:#1f2937;
}

/* TABS */
.tabs{
    display:flex;
    gap:30px;
    border-bottom:2px solid #e5e7eb;
    margin-top:30px;
}

.tab{
    padding:10px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    border-bottom:3px solid #2563eb;
    color:#2563eb;
}

</style>

</head>

<body>

<!--  PANEL -->
<div class="panel-container">

    <!-- SELECT -->
    <select class="select-box">
        <option>Seleccione el Corte</option>
        <option>1er Corte</option>
        <option>2do Corte</option>
    </select>

    <!-- TABLA SUPERIOR -->
    <div class="table-container mt-3">

        <table class="table">
            <thead>
                <tr>
                    <th>NOMBRE DEL ALUMNO</th>
                    <th>GRADO</th>
                    <th>OPCIONES</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td colspan="3" class="text-center text-muted">
                        No hay datos en la tabla
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- TABS COMO TU IMAGEN -->
    <div class="tabs mt-4">

        <div class="tab active">
            EVALUACIÓN EN PROCESO
        </div>

        <div class="tab">
            NOTA DEL BOLETÍN POR CORTE
        </div>

    </div>

    <!-- TABLA GRANDE -->
    <div class="table-container mt-3">

        <table class="table table-bordered text-center">

            <thead>
                <tr>
                    <th>DISCIPLINA</th>
                    <th>1EP</th>
                    <th>2EP</th>
                    <th>3EP</th>
                    <th>4EP</th>
                    <th>5EP</th>
                    <th>6EP</th>
                    <th>7EP</th>
                    <th>8EP</th>
                    <th>9EP</th>
                    <th>10EP</th>
                    <th>ACUM</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td colspan="12" class="text-muted">
                        No hay datos en la tabla
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
