<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Conversación Familiar | CIEM ONE
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<style>

body{

    background:#f1f5f9;

}



.chat-container{

    max-width:900px;

    margin:auto;

}



.chat-box{

    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.1);

}



.mensaje{

    padding:15px;

    border-radius:15px;

    margin-bottom:15px;

    max-width:75%;

}



.padre{

    background:#e9ecef;

    margin-right:auto;

}



.docente{

    background:#0d6efd;

    color:white;

    margin-left:auto;

}



.fecha{

    font-size:12px;

    opacity:.7;

}



</style>

</head>


<body>


<div class="container py-5 chat-container">


<div class="card shadow border-0">


<div class="card-header bg-primary text-white">


<h4>

<i class="bi bi-chat-dots-fill"></i>

Conversación Familiar

</h4>


</div>



<div class="card-body chat-box">



{% for m in mensajes %}



{% if m.emisor == "docente" %}


<div class="mensaje docente">


<strong>

Docente

</strong>


<br>


{{m.mensaje}}


<div class="fecha text-white">

{{m.fecha.strftime("%d/%m/%Y %H:%M")}}

</div>


</div>



{% else %}



<div class="mensaje padre">


<strong>

Padre

</strong>


<br>


{{m.mensaje}}


<div class="fecha">

{{m.fecha.strftime("%d/%m/%Y %H:%M")}}

</div>


</div>


{% endif %}



{% endfor %}




<hr>

<form method="POST"
action="{{ url_for('docente.responder_mensaje', id=conversacion._id) }}">


<input type="hidden"
name="conversacion_id"
value="{{conversacion._id}}">


<div class="input-group">


<textarea

class="form-control"

name="respuesta"

placeholder="Escriba su respuesta..."

required></textarea>



<button class="btn btn-primary">


<i class="bi bi-send-fill"></i>

Enviar


</button>


</div>


</form>



</div>

</div>


</div>



</body>

</html>
