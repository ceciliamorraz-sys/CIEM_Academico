<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Docentes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="text-center mb-4">

        <img src="{{ url_for('static', filename='img/logo.jpg') }}"
             alt="Logo"
             style="width:120px;">

        <h2 class="mt-3">👨‍🏫 Gestión de Docentes</h2>

    </div>

    <!-- BOTONES -->
    <div class="mb-3">

        <a href="/dashboard" class="btn btn-secondary">
            ← Dashboard
        </a>

        <a href="{{ url_for('agregar_docente') }}" class="btn btn-success">
            ➕ Nuevo Docente
        </a>

    </div>

    <!-- TABLA -->
    <table class="table table-striped table-bordered">

        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            {% for d in docentes %}

            <tr>
                <td>{{ d.codigo }}</td>
                <td>{{ d.nombre }}</td>
                <td>{{ d.especialidad }}</td>
                <td>{{ d.email }}</td>

                <td>

                    <!-- EDITAR -->
                    <a href="{{ url_for('editar_docente', id=d._id) }}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <!-- ELIMINAR -->
                    <a href="{{ url_for('eliminar_docente', id=d._id) }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar este docente?')">
                        Eliminar
                    </a>

                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
