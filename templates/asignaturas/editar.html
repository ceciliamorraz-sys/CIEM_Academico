<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Editar Asignatura | CIEM Académico
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:#f1f5f9;
font-family:'Segoe UI';

}


.card{

border:none;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}


.header{

background:linear-gradient(135deg,#08142C,#1E4E8C);
color:white;
padding:25px;
border-radius:20px;

}


.btn-ciem{

background:#2563eb;
color:white;

}

</style>


</head>


<body>


<div class="container mt-4">


<div class="header mb-4">


<h2>
✏️ Editar Asignatura
</h2>


<p>
Actualización académica CIEM
</p>


</div>




<div class="card">


<div class="card-body">


<form method="POST">


<div class="row">



<div class="col-md-6 mb-3">

<label>
Código
</label>

<input 
type="text"
name="codigo"
class="form-control"
value="{{ asignatura.codigo }}"
required>

</div>





<div class="col-md-6 mb-3">

<label>
Nombre
</label>

<input 
type="text"
name="nombre"
class="form-control"
value="{{ asignatura.nombre }}"
required>

</div>





<div class="col-md-6 mb-3">

<label>
Nivel
</label>


<select name="nivel"
class="form-select"
required>


<option value="Preescolar"
{% if asignatura.nivel=="Preescolar" %}selected{% endif %}>
Preescolar
</option>


<option value="Primaria"
{% if asignatura.nivel=="Primaria" %}selected{% endif %}>
Primaria
</option>


<option value="Secundaria"
{% if asignatura.nivel=="Secundaria" %}selected{% endif %}>
Secundaria
</option>


</select>

</div>






<div class="col-md-6 mb-3">

<label>
Grado
</label>


<input 
type="text"
name="grado"
class="form-control"
value="{{ asignatura.grado }}">


</div>





<div class="col-md-12 mb-3">

<label>
Docente Responsable
</label>


<select name="docente_id"
class="form-select"
required>


<option value="">
Seleccione docente
</option>



{% for d in docentes %}


<option value="{{ d._id }}"
{% if asignatura.docente_id|string == d._id|string %}
selected
{% endif %}
>


{{ d.nombre }} - {{ d.cargo }}


</option>


{% endfor %}



</select>


</div>


</div>



<button class="btn btn-ciem">

💾 Guardar cambios

</button>


<a href="{{ url_for('listar_asignaturas') }}"
class="btn btn-secondary">

Cancelar

</a>


<a href="{{ url_for('admin_dashboard') }}"
class="btn btn-dark">

🏠 Dashboard

</a>


</form>


</div>


</div>


</div>


</body>

</html>
