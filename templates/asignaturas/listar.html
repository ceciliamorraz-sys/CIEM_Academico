<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignaturas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="text-center mb-4">

        <img src="{{ url_for('static', filename='img/logo.jpg') }}"
             alt="Logo"
             style="width:120px;">

        <h2 class="mt-3">📚 Gestión de Asignaturas</h2>

    </div>

    <!-- BOTONES -->
    <div class="mb-3">

        <a href="{{ url_for('admin_dashboard') }}"
        class="btn btn-light">

        🏠 Dashboard

        </a>
        <a href="{{ url_for('agregar_asignatura') }}" class="btn btn-success">
            ➕ Nueva Asignatura
        </a>

    </div>

    <!-- TABLA -->
    <table class="table table-striped table-bordered">

        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Grado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            {% for a in asignaturas %}

            <tr>
                <td>{{ a.codigo }}</td>
                <td>{{ a.nombre }}</td>
                <td>{{ a.grado }}</td>

                <td>

                    <!-- EDITAR -->
                    <a href="{{ url_for('editar_asignatura', id=a._id) }}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <!-- ELIMINAR -->
                    <a href="{{ url_for('eliminar_asignatura', id=a._id) }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar esta asignatura?')">
                        Eliminar
                    </a>

                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
