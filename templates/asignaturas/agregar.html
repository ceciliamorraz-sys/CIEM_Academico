
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Agregar Asignatura | CIEM Académico
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f1f5f9;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .contenedor {
            max-width: 850px;
            margin: 50px auto;
        }

        .card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background: linear-gradient(
                135deg,
                #08142C,
                #1E4E8C
            );
            color: white;
            padding: 25px;
        }

        .card-header h2 {
            margin: 0;
            font-weight: 700;
        }

        .card-header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }

        .card-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
            color: #1D3256;
        }

        .form-control,
        .form-select {
            min-height: 45px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1E4E8C;
            box-shadow: 0 0 0 0.2rem rgba(30, 78, 140, 0.15);
        }

        .btn-guardar {
            background: #198754;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-guardar:hover {
            background: #157347;
            color: white;
        }

        .btn-volver {
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
        }

        .info-docente {
            background: #f8fafc;
            border-left: 4px solid #1E4E8C;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 14px;
            color: #475569;
        }

    </style>

</head>


<body>


<div class="container contenedor">

    <div class="card">


        <!-- ==========================================
             ENCABEZADO
        =========================================== -->

        <div class="card-header">

            <h2>
                📚 Nueva Asignatura
            </h2>

            <p>
                Registro de asignaturas — CIEM Académico
            </p>

        </div>


        <!-- ==========================================
             CUERPO
        =========================================== -->

        <div class="card-body">


            <form
                method="POST"
                action="{{ url_for('agregar_asignatura') }}"
            >


                <div class="row">


                    <!-- ==================================
                         CÓDIGO
                    =================================== -->

                    <div class="col-md-6 mb-4">

                        <label
                            for="codigo"
                            class="form-label"
                        >
                            Código de la asignatura
                        </label>

                        <input
                            type="text"
                            id="codigo"
                            name="codigo"
                            class="form-control"
                            placeholder="Ej. MAT"
                            required
                        >

                    </div>


                    <!-- ==================================
                         NOMBRE
                    =================================== -->

                    <div class="col-md-6 mb-4">

                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre de la asignatura
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            placeholder="Ej. Matemática"
                            required
                        >

                    </div>


                    <!-- ==================================
                         NIVEL
                    =================================== -->

                    <div class="col-md-6 mb-4">

                        <label
                            for="nivel"
                            class="form-label"
                        >
                            Nivel educativo
                        </label>

                        <select
                            id="nivel"
                            name="nivel"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione el nivel
                            </option>

                            <option value="Preescolar">
                                Preescolar
                            </option>

                            <option value="Primaria">
                                Primaria
                            </option>

                            <option value="Secundaria">
                                Secundaria
                            </option>

                        </select>

                    </div>


                    <!-- ==================================
                         GRADO
                    =================================== -->

                    <div class="col-md-6 mb-4">

                        <label
                            for="grado"
                            class="form-label"
                        >
                            Grado / Nivel
                        </label>

                        <select
                            id="grado"
                            name="grado"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione el grado
                            </option>


                            <!-- PREESCOLAR -->

                            <optgroup label="Preescolar">

                                <option value="I Nivel">
                                    I Nivel
                                </option>

                                <option value="II Nivel">
                                    II Nivel
                                </option>

                                <option value="III Nivel">
                                    III Nivel
                                </option>

                            </optgroup>


                            <!-- PRIMARIA -->

                            <optgroup label="Primaria">

                                <option value="1">
                                    1er Grado
                                </option>

                                <option value="2">
                                    2do Grado
                                </option>

                                <option value="3">
                                    3er Grado
                                </option>

                                <option value="4">
                                    4to Grado
                                </option>

                                <option value="5">
                                    5to Grado
                                </option>

                                <option value="6">
                                    6to Grado
                                </option>

                            </optgroup>


                            <!-- SECUNDARIA -->

                            <optgroup label="Secundaria">

                                <option value="1 Año">
                                    1 Año
                                </option>

                                <option value="2 Año">
                                    2 Año
                                </option>

                                <option value="3 Año">
                                    3 Año
                                </option>

                                <option value="4 Año">
                                    4 Año
                                </option>

                                <option value="5 Año">
                                    5 Año
                                </option>

                            </optgroup>

                        </select>

                    </div>


                    <!-- ==================================
                         DOCENTE
                    =================================== -->

                    <div class="col-12 mb-4">

                        <label
                            for="docente_id"
                            class="form-label"
                        >
                            Docente responsable
                        </label>


                        <select
                            id="docente_id"
                            name="docente_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione el docente
                            </option>


                            {% for docente in docentes %}

                                <option
                                    value="{{ docente._id }}"
                                >

                                    {{ docente.nombre }}

                                    {% if docente.cargo %}
                                        — {{ docente.cargo }}
                                    {% endif %}

                                    — ID: {{ docente._id }}

                                </option>

                            {% endfor %}


                        </select>


                        <div class="info-docente">

                            ℹ️ El docente seleccionado quedará asociado
                            directamente a esta asignatura.

                        </div>

                    </div>


                </div>


                <!-- ==================================
                     BOTONES
                =================================== -->

                <div class="d-flex gap-2 mt-3">


                    <button
                        type="submit"
                        class="btn btn-guardar"
                    >

                        💾 Guardar asignatura

                    </button>


                    <a
                        href="{{ url_for('listar_asignaturas') }}"
                        class="btn btn-secondary btn-volver"
                    >

                        ← Volver

                    </a>


                </div>


            </form>


        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
