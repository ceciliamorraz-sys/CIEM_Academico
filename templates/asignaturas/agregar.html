<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agregar Asignatura</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>📚 Nueva Asignatura</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Código</label>
                    <input type="text"
                           class="form-control"
                           name="codigo"
                           required>
                </div>

                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text"
                           class="form-control"
                           name="nombre"
                           required>
                </div>

                <div class="mb-3">
                    <label>Grado</label>

                    <select class="form-select"
                            name="grado">

                        <option>1ro</option>
                        <option>2do</option>
                        <option>3ro</option>
                        <option>4to</option>
                        <option>5to</option>
                        <<option>6to</option>

                    </select>

                </div>

                <button class="btn btn-success">
                    Guardar
                </button>

                <a href="/asignaturas"
                   class="btn btn-secondary">
                    Volver
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
