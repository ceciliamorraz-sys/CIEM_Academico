<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mensajes Padres</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h3>Mensajes enviados a padres</h3>

<table class="table table-striped">

<thead>
<tr>
    <th>Padre</th>
    <th>Mensaje</th>
    <th>Fecha</th>
    <th>Estado</th>
</tr>
</thead>

<tbody>

{% for m in mensajes %}
<tr>
    <td>{{ m.padre }}</td>
    <td>{{ m.mensaje }}</td>
    <td>{{ m.fecha }}</td>
    <td>
        {% if m.leido %}
            <span class="badge bg-success">Leído</span>
        {% else %}
            <span class="badge bg-warning">No leído</span>
        {% endif %}
    </td>
</tr>
{% endfor %}

</tbody>

</table>

</body>
</html>
